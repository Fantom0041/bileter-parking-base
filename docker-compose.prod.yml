services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: parking-app-prod
    restart: unless-stopped
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    # No ports exposed directly to host, only to internal network (default)

  nginx:
    image: nginx:alpine
    container_name: parking-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      # Mount certificates here
      # - ./certs:/etc/nginx/certs
    depends_on:
      - app
